# Supprimer toutes les ressources de la boutique (durée de vie courte).
# - À la main : saisir DETRUIRE pour confirmer.
# - Chaque soir à 19 h (heure d'Abidjan = UTC) si la variable DESTRUCTION_AUTO vaut « oui »,
#   filet de sécurité pour qu'une application volontairement vulnérable ne reste jamais en ligne.
name: Détruire la boutique

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez DETRUIRE pour confirmer"
        required: true
        type: string
  schedule:
    - cron: "0 19 * * *"

permissions: {}

concurrency:
  group: lagune-infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.17.1"

jobs:
  detruire:
    name: Détruire
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DETRUIRE') ||
      (github.event_name == 'schedule' && vars.DESTRUCTION_AUTO == 'oui')
    runs-on: ubuntu-latest
    # Environnement sans relecteur (la destruction planifiée ne doit pas attendre),
    # avec sa propre identité fédérée « environment:destruction ».
    environment: destruction
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TF_VAR_room_ip_cidr: ${{ vars.ROOM_IP_CIDR }}
      TF_VAR_prefix: ${{ vars.LAGUNE_PREFIX }}
      TF_VAR_enable_custom_domain: ${{ vars.ENABLE_CUSTOM_DOMAIN || 'false' }}
      TF_VAR_custom_hostname: ${{ vars.CUSTOM_HOSTNAME }}
      TF_VAR_budget_contact_email: ${{ vars.BUDGET_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialiser avec l'état distant
        run: >-
          terraform init
          -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"
          -backend-config="container_name=tfstate"
          -backend-config="key=boutique.tfstate"

      - name: Montrer ce qui va disparaître
        run: terraform plan -destroy

      - name: Détruire
        run: terraform destroy -auto-approve
